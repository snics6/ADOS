# Smoke test: same as default but 1 training epoch (no early-stop wait).
# Usage:
#   python scripts/train.py --config configs/smoke_epoch1.yaml --device cuda \
#     --features outputs/features/20260722T084542Z/features.csv

seed: 42
device: cuda

paths:
  data_root: data
  labels_xlsx: data/ADOS2_result_2.xlsx
  labels_sheet: "ADOS-2,Module2,2017年以降"
  cohort: configs/cohorts/four_tasks_33.yaml
  output_root: outputs

tasks:
  - id: 3
    name: pretend_play
    name_ja: ごっこ遊び
  - id: 4
    name: interactive_play
    name_ja: 共同で行う相互的な遊び
  - id: 11
    name: birthday_party
    name_ja: 誕生パーティ
  - id: 12
    name: snack
    name_ja: おやつ

targets:
  SA:
    type: regression
    column: "SA(対人的感情)"
  RRB:
    type: regression
    column: "RRB(限定的・反復的行動)"
  C2:
    type: ordinal
    column: "C-2_想像力/創造性"
    levels: [0, 1, 2, 3]
  B1:
    type: binary
    column: "B-1_普通ではないアイコンタクト"
    positive: 2
    negative: 0
  B12:
    type: ordinal
    column: "B-12_全体的なラポールの質"
    levels: [0, 1, 2]

features:
  roles: [child, dyad]
  confidence_weighting: true
  exclude_as_predictors:
    - visible_joint_ratio
    - pose_quality
    - det_score
    - role_confidence
    - speaker_confidence
    - two_person_rate

cv:
  n_folds: 4
  stratify_by: SA_tertile

model:
  encoder_hidden: 64
  encoder_layers: 2
  dropout: 0.15
  task_attention: per_target
  shared_trunk: false

train:
  batch_size: 8
  max_epochs: 1
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 1
  huber_beta: 1.0

loss_weights:
  SA: 1.0
  RRB: 0.5
  C2: 1.0
  B1: 0.5
  B12: 0.75

explain:
  log_task_attention: true
  c2_require_pretend_max_attention: true
  c2_pretend_ablation: true
  dyad_ablation: true
  sklearn_baseline: true
